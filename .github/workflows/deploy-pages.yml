name: Deploy INNATE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "innate-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Install Godot 4.6.3 Standard and matching web templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot/releases/download/4.6.3-stable
          curl -fL --retry 3 "$BASE/Godot_v4.6.3-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl -fL --retry 3 "$BASE/Godot_v4.6.3-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
          "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64" --version

      - name: Generate experimental map and export playable web game
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64"
          "$GODOT" --headless --path . --editor --import --quit
          "$GODOT" --headless --path . --script res://tools/build_world.gd 2>&1 | tee "$RUNNER_TEMP/world-build.log"
          if grep -E 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/world-build.log"; then
            echo "Map generator logged a Godot error" >&2
            exit 1
          fi
          python tools/export_web.py --godot "$GODOT"

      - name: Upload browser game
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
