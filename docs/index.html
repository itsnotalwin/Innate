<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f2e0">

<title>INNATE</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: #f5f2e0; }
body { touch-action: none; font-family: ui-rounded, system-ui, sans-serif; color: #405e46; }
#canvas { image-rendering: pixelated; display: block; width: 100%; height: 100%; outline: none; }
#status { position: fixed; inset: 0; display: grid; place-items: center; background: #f5f2e0; z-index: 2; }
.loading { width: min(65vw, 240px); text-align: center; }
.character { width: 48px; height: 48px; margin: 28px auto; background: url('loader-character.png') 0 0 / 192px 192px; image-rendering: pixelated; transform: scale(2); }
h1 { font-size: 22px; font-weight: 500; letter-spacing: .32em; margin: 24px 0; padding-left: .32em; }
progress { display: block; width: 100%; height: 4px; border: 0; border-radius: 4px; overflow: hidden; background: #e0e3c9; accent-color: #809965; }
progress::-webkit-progress-bar { background: #e0e3c9; }
progress::-webkit-progress-value { background: #809965; }
progress::-moz-progress-bar { background: #809965; }
.credit { position: absolute; bottom: max(22px, env(safe-area-inset-bottom)); left: 16px; right: 16px; text-align: center; font-size: 11px; color: #697860; }
.credit a { color: inherit; text-decoration: none; }
#notice { font-size: 14px; line-height: 1.5; }
#retry { margin: 16px auto; padding: 10px 22px; border: 1px solid #809965; border-radius: 20px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
#safe-area { position: fixed; visibility: hidden; pointer-events: none; padding-left: env(safe-area-inset-left); padding-bottom: env(safe-area-inset-bottom); }
</style>

</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="INNATE exploration game"></canvas>
<div id="safe-area" aria-hidden="true"></div>
<div id="status" role="status" aria-label="Loading INNATE">
  <div class="loading">
    <div class="character" aria-hidden="true"></div>
    <h1>INNATE</h1>
    <progress id="progress" aria-label="Download progress"></progress>
    <p id="notice" hidden></p>
    <button id="retry" hidden onclick="location.reload()">Try again</button>
  </div>
  <div class="credit"><a href="https://cupnooble.itch.io/sprout-lands-asset-pack" target="_blank" rel="noopener">Sprout Lands — Assets by Cup Nooble</a></div>
</div>
<noscript>Enable JavaScript to play INNATE.</noscript>
<script>
'use strict';
const canvas = document.getElementById('canvas');
// Bound fill-rate independently of CSS screen size and device pixel ratio.
// The 16px source artwork stays nearest-filtered; the page still fills the screen.
const MAX_RENDER_EDGE = 720;
let renderScale = 1;
function resizeCanvas() {
  renderScale = Math.min(1, MAX_RENDER_EDGE / Math.max(innerWidth, innerHeight));
  canvas.width = Math.max(1, Math.round(innerWidth * renderScale));
  canvas.height = Math.max(1, Math.round(innerHeight * renderScale));
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.innateSafeArea = () => {
  const style = getComputedStyle(document.getElementById('safe-area'));
  return [(parseFloat(style.paddingLeft) || 0) * renderScale, (parseFloat(style.paddingBottom) || 0) * renderScale];
};
window.innateReady = () => {
  document.getElementById('status')?.remove();
  performance.mark('innate-ready');
  canvas.focus({preventScroll: true});
};
canvas.addEventListener('keydown', event => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(event.code)) event.preventDefault();
});
canvas.addEventListener('pointerdown', () => canvas.focus({preventScroll: true}));
function showFailure(error) {
  console.error(error);
  const notice = document.getElementById('notice');
  if (!notice) return;
  document.getElementById('progress').hidden = true;
  notice.textContent = 'The world could not load. Check your connection and try again. A browser with WebGL 2 is required.';
  notice.hidden = false;
  document.getElementById('retry').hidden = false;
}
</script>
<script src="index.js" onerror="showFailure('Game runtime download failed')"></script>
<script>
if (typeof Engine !== 'undefined') {
  const config = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.wasm":37700666,"game-506229021cd161a5.pck":283216},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"mainPack":"game-506229021cd161a5.pck"};
  const missing = Engine.getMissingFeatures({threads: false});
  if (missing.length) {
    showFailure(missing.join(', '));
  } else {
    const engine = new Engine(config);
    engine.startGame({onProgress(current, total) {
      const progress = document.getElementById('progress');
      if (progress && total > 0) { progress.max = total; progress.value = current; }
    }}).catch(showFailure);
  }
}
</script>
</body>
</html>
