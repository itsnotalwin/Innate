<script>
'use strict';
const canvas = document.getElementById('canvas');
// Bound fill-rate independently of CSS screen size and device pixel ratio.
// The 16px source artwork stays nearest-filtered; the page still fills the screen.
const MAX_RENDER_EDGE = 720;
let renderScale = 1;
function resizeCanvas() {
  renderScale = Math.min(1, MAX_RENDER_EDGE / Math.max(innerWidth, innerHeight));
  const width = Math.max(1, Math.round(innerWidth * renderScale));
  const height = Math.max(1, Math.round(innerHeight * renderScale));
  if (canvas.width !== width) canvas.width = width;
  if (canvas.height !== height) canvas.height = height;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.innateSafeArea = () => {
  const style = getComputedStyle(document.getElementById('safe-area'));
  return [(parseFloat(style.paddingLeft) || 0) * renderScale, (parseFloat(style.paddingBottom) || 0) * renderScale,
    (parseFloat(style.paddingTop) || 0) * renderScale, (parseFloat(style.paddingRight) || 0) * renderScale];
};
window.innateReady = () => {
  clearTimeout(startupWatchdog);
  performance.mark('innate-ready');
  const status = document.getElementById('status');
  if (status) {
    status.classList.add('is-leaving');
    setTimeout(() => { if (status.classList.contains('is-leaving')) status.hidden = true; }, 570);
  }
  canvas.focus({preventScroll: true});
};
canvas.addEventListener('keydown', event => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(event.code)) event.preventDefault();
});
canvas.addEventListener('pointerdown', () => canvas.focus({preventScroll: true}));
function showFailure(error, message = 'The world could not load. Check your connection and try again. A browser with WebGL 2 is required.') {
  clearTimeout(startupWatchdog);
  console.error(error);
  const status = document.getElementById('status');
  if (!status) return;
  status.hidden = false;
  status.classList.remove('is-leaving');
  status.dataset.state = 'error';
  status.setAttribute('role', 'alertdialog');
  const notice = document.getElementById('notice');
  notice.textContent = message;
  notice.hidden = false;
  document.getElementById('retry').hidden = false;
  document.getElementById('retry').focus({preventScroll: true});
}
let startupWatchdog = 0;
canvas.addEventListener('webglcontextlost', event => {
  event.preventDefault();
  window.dispatchEvent(new Event('blur'));
  showFailure('Graphics context lost', 'The graphics connection was interrupted. Tap Try again to reload the world.');
});
const nativeFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const request = args[0];
  const url = typeof request === 'string' ? request : request?.url || '';
  try {
    const response = await nativeFetch(...args);
    if (!response.ok && /\.(pck|wasm)(?:$|[?#])/i.test(url)) {
      throw new Error(`Game file download failed (${response.status}): ${url}`);
    }
    return response;
  } catch (error) {
    if (/\.(pck|wasm)(?:$|[?#])/i.test(url)) showFailure(error);
    throw error;
  }
};
const nativeXhrOpen = XMLHttpRequest.prototype.open;
const nativeXhrSend = XMLHttpRequest.prototype.send;
XMLHttpRequest.prototype.open = function(method, url, ...rest) {
  this.__innateResourceUrl = String(url);
  return nativeXhrOpen.call(this, method, url, ...rest);
};
XMLHttpRequest.prototype.send = function(...args) {
  const url = this.__innateResourceUrl || '';
  if (/\.(pck|wasm)(?:$|[?#])/i.test(url)) {
    this.addEventListener('loadend', () => {
      if (this.status === 0 || this.status >= 400) showFailure(`Game file request failed (${this.status}): ${url}`);
    }, {once: true});
  }
  return nativeXhrSend.apply(this, args);
};
</script>
