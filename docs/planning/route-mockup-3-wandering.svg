xt><rect x="150.0" y="553.0" width="170" height="64" rx="18" fill="#ebc1d1" stroke="#98536e" stroke-width="2" stroke-dasharray="7 4" filter="url(#sh)"/><text x="235" y="590" text-anchor="middle" font-family="Verdana,sans-serif" font-size="13" font-weight="700" fill="#98536e">FLOWER MEADOW</text><rect x="492.5" y="384.0" width="185" height="72" rx="18" fill="#c8dda5" stroke="#52734e" stroke-width="2" stroke-dasharray="7 4" filter="url(#sh)"/><text x="585" y="425" text-anchor="middle" font-family="Verdana,sans-serif" font-size="13" font-weight="700" fill="#52734e">COTTAGE + GARDEN</text><text x="55" y="730" font-family="Verdana,sans-serif" font-size="14" font-weight="700" fill="#31574b">How it feels</text><text x="55" y="755" font-family="Verdana,sans-serif" font-size="14" fill="#536b5d">One continuous trail bends through small clearings and passes near each destination in sequence. Optional short spurs lead into the areas; the cottage remains a nearby starting point, not a road junction for every trip.</text><text x="1060" y="650" font-family="Verdana" font-size="12" fill="#829184">N ↑</text></svg>