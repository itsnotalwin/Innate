<!DOCTYPE html>
<html lang="en">
<head>
<base href="./docs/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f2e0">

<title>INNATE</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: #f5f2e0; }
body { touch-action: none; font-family: ui-rounded, system-ui, sans-serif; color: #405e46; }
#canvas { image-rendering: pixelated; display: block; width: 100%; height: 100%; outline: none; }
#status { position: fixed; inset: 0; display: grid; place-items: center; background: #f5f2e0; z-index: 2; }
.loading { width: min(65vw, 240px); text-align: center; }
.character { width: 48px; height: 48px; margin: 28px auto; background: url('loader-character.png') 0 0 / 192px 192px; image-rendering: pixelated; transform: scale(2); }
h1 { font-size: 22px; font-weight: 500; letter-spacing: .32em; margin: 24px 0; padding-left: .32em; }
progress { display: block; width: 100%; height: 4px; border: 0; border-radius: 4px; overflow: hidden; background: #e0e3c9; accent-color: #809965; }
progress::-webkit-progress-bar { background: #e0e3c9; }
progress::-webkit-progress-value { background: #809965; }
progress::-moz-progress-bar { background: #809965; }
.credit { position: absolute; bottom: max(22px, env(safe-area-inset-bottom)); left: 16px; right: 16px; text-align: center; font-size: 11px; color: #697860; }
.credit a { color: inherit; text-decoration: none; }
#notice { font-size: 14px; line-height: 1.5; }
#retry { margin: 16px auto; padding: 10px 22px; border: 1px solid #809965; border-radius: 20px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
#safe-area { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>

</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="INNATE exploration game"></canvas>
<div id="safe-area" aria-hidden="true"></div>
<div id="status" role="status" aria-label="Loading INNATE">
  <div class="loading">
    <div class="character" aria-hidden="true"></div>
    <h1>INNATE</h1>
    <progress id="progress" aria-label="Download progress"></progress>
    <p id="notice" hidden></p>
    <button id="retry" hidden onclick="location.reload()">Try again</button>
  </div>
  <div class="credit"><a href="https://cupnooble.itch.io/sprout-lands-asset-pack" target="_blank" rel="noopener">Sprout Lands — Assets by Cup Nooble</a></div>
</div>
<noscript>Enable JavaScript to play INNATE.</noscript>
<script>
'use strict';
const canvas = document.getElementById('canvas');
// Bound fill-rate independently of CSS screen size and device pixel ratio.
// The 16px source artwork stays nearest-filtered; the page still fills the screen.
const MAX_RENDER_EDGE = 720;
let renderScale = 1;
function resizeCanvas() {
  renderScale = Math.min(1, MAX_RENDER_EDGE / Math.max(innerWidth, innerHeight));
  const width = Math.max(1, Math.round(innerWidth * renderScale));
  const height = Math.max(1, Math.round(innerHeight * renderScale));
  if (canvas.width !== width) canvas.width = width;
  if (canvas.height !== height) canvas.height = height;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.innateSafeArea = () => {
  const style = getComputedStyle(document.getElementById('safe-area'));
  return [(parseFloat(style.paddingLeft) || 0) * renderScale, (parseFloat(style.paddingBottom) || 0) * renderScale,
    (parseFloat(style.paddingTop) || 0) * renderScale, (parseFloat(style.paddingRight) || 0) * renderScale];
};
window.innateReady = () => {
  document.getElementById('status')?.remove();
  clearTimeout(startupWatchdog);
  performance.mark('innate-ready');
  canvas.focus({preventScroll: true});
};
canvas.addEventListener('keydown', event => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(event.code)) event.preventDefault();
});
canvas.addEventListener('pointerdown', () => canvas.focus({preventScroll: true}));
function showFailure(error, message = 'The world could not load. Check your connection and try again. A browser with WebGL 2 is required.') {
  clearTimeout(startupWatchdog);
  console.error(error);
  // The loader is removed after launch; recreate a recovery surface if graphics
  // are lost later (for example under mobile memory pressure).
  if (!document.getElementById('status')) {
    const status = document.createElement('div');
    status.id = 'status'; status.setAttribute('role', 'alert');
    const content = document.createElement('div'); content.className = 'loading';
    const notice = document.createElement('p'); notice.id = 'notice';
    const retry = document.createElement('button'); retry.id = 'retry';
    retry.textContent = 'Try again'; retry.addEventListener('click', () => location.reload());
    content.append(notice, retry); status.append(content); document.body.append(status);
  }
  const notice = document.getElementById('notice');
  if (!notice) return;
  const progress = document.getElementById('progress');
  if (progress) progress.hidden = true;
  notice.textContent = message;
  notice.hidden = false;
  document.getElementById('retry').hidden = false;
}
let startupWatchdog = 0;
canvas.addEventListener('webglcontextlost', event => {
  event.preventDefault();
  window.dispatchEvent(new Event('blur'));
  showFailure('Graphics context lost', 'The graphics connection was interrupted. Tap Try again to reload the world.');
});
const nativeFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const request = args[0];
  const url = typeof request === 'string' ? request : request?.url || '';
  try {
    const response = await nativeFetch(...args);
    if (!response.ok && /\.(pck|wasm)(?:$|[?#])/i.test(url)) {
      throw new Error(`Game file download failed (${response.status}): ${url}`);
    }
    return response;
  } catch (error) {
    if (/\.(pck|wasm)(?:$|[?#])/i.test(url)) showFailure(error);
    throw error;
  }
};
const nativeXhrOpen = XMLHttpRequest.prototype.open;
const nativeXhrSend = XMLHttpRequest.prototype.send;
XMLHttpRequest.prototype.open = function(method, url, ...rest) {
  this.__innateResourceUrl = String(url);
  return nativeXhrOpen.call(this, method, url, ...rest);
};
XMLHttpRequest.prototype.send = function(...args) {
  const url = this.__innateResourceUrl || '';
  if (/\.(pck|wasm)(?:$|[?#])/i.test(url)) {
    this.addEventListener('loadend', () => {
      if (this.status === 0 || this.status >= 400) showFailure(`Game file request failed (${this.status}): ${url}`);
    }, {once: true});
  }
  return nativeXhrSend.apply(this, args);
};
</script>
<script src="index.js" onerror="showFailure('Game runtime download failed')"></script>
<script>
if (typeof Engine !== 'undefined') {
  const config = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.wasm":37700666,"game-e41d012175223082.pck":1354128},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"mainPack":"game-e41d012175223082.pck"};
  const missing = Engine.getMissingFeatures({threads: false});
  if (missing.length) {
    showFailure(missing.join(', '));
  } else {
    const engine = new Engine(config);
    startupWatchdog = setTimeout(() => {
      if (document.getElementById('status')) showFailure('Game startup timed out', 'The world is taking too long to load. Check your connection and try again.');
    }, 30000);
    engine.startGame({onProgress(current, total) {
      const progress = document.getElementById('progress');
      if (progress && total > 0) { progress.max = total; progress.value = current; }
    }}).catch(showFailure);
  }
}
</script>
